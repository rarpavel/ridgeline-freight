name: ci

# Pull request runs already cover pushes to open PRs, so push runs are limited to main.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          # Throwaway container, reachable only from this job. CI needs no secrets (TESTING.md §4).
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ridgeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ridgeline"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm datagen:validate
      - run: pnpm test:integration
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ridgeline
