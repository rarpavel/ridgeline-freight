services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      # Local development only; bound to localhost below.
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ridgeline
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ridgeline']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
